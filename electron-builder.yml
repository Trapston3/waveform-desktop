appId: com.waveform.desktop
productName: WaveForm
afterPack: scripts/after-pack-manifest.mjs
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/assets/data/**"
  - dist-electron/**/*
  - native/waveform-core/*.node
  - "!native/waveform-core/target/**"
  - build/icon.ico
  - build/icon.png
  - package.json
asarUnpack:
  - "dist/assets/*.otf"
  - "dist/assets/*.ttf"
  - "dist/assets/*.woff2"
  - "dist/assets/*.woff"
  - "dist/assets/*.png"
  - "native/waveform-core/*.node"
extraResources:
  - from: src/assets/data
    to: assets/data
    filter:
      - "**/*"
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.png
    to: build/icon.png
win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  differentialPackage: true
  include: build/installer.nsh
  shortcutName: WaveForm
  artifactName: WaveForm-Setup-${version}.exe
portable:
  artifactName: WaveForm-Portable-${version}.exe
publish:
  - provider: github
    owner: trapston3
    repo: waveform-desktop
