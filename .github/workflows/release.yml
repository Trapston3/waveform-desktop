name: Build & Release Windows Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS Setup & Portable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Build Windows Setup & Portable executables
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: waveform-windows-x64
          path: |
            release/WaveForm-Setup-*.exe
            release/WaveForm-Portable-*.exe
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/WaveForm-Setup-*.exe
            release/WaveForm-Portable-*.exe
            release/latest.yml
            release/SHA256SUMS.txt
